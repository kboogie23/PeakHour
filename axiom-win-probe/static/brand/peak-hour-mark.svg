<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <title>PEAK HOUR</title>
  <defs>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d9d8d6"/><stop offset=".55" stop-color="#8f9398"/><stop offset=".8" stop-color="#e5e4e2"/><stop offset="1" stop-color="#a9adb2"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3346"/><stop offset="1" stop-color="#a80016"/>
    </linearGradient>
    <radialGradient id="vinyl" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1c1a1a"/><stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
