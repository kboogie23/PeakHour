  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#plat)"/>
  <circle cx="128" cy="128" r="108" fill="url(#vinyl)"/>
  <g fill="none" stroke="#2a2727" stroke-width="1.5">
    <circle cx="128" cy="128" r="98"/><circle cx="128" cy="128" r="88"/><circle cx="128" cy="128" r="78"/><circle cx="128" cy="128" r="68"/><circle cx="128" cy="128" r="58"/>
  </g>
  <circle cx="128" cy="128" r="36" fill="url(#red)"/>
  <circle cx="128" cy="128" r="5" fill="#0d0c0c"/>
  <polyline points="26,150 52,150 62,138 72,160 84,132 96,150 106,150 128,40 150,150 160,150 172,132 184,160 194,138 204,150 230,150"
