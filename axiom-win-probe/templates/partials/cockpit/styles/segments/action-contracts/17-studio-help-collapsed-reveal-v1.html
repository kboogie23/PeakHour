<style id="studio-help-collapsed-reveal-v1">

    min-width: 42px !important;
    max-width: 42px !important;
    height: 42px !important;
    min-height: 42px !important;
    padding: 0 !important;
    overflow: hidden !important;
    border: 1px solid var(--accent) !important;
    border-radius: 8px !important;
    background: var(--accent) !important;
    color: #071005 !important;
    transition: width 180ms ease, max-width 180ms ease, height 180ms ease,
      border-radius 180ms ease, background-color 180ms ease !important;
  }

  html body #studio-active-view#studio-active-view
    .studio-header .studio-actions
    #btn-studio-guide.studio-help-btn.axiom-help-btn:is(:hover, :focus-visible) {

    max-width: 96px !important;
    height: 48px !important;
    min-height: 48px !important;
    border-color: var(--accent) !important;
    border-radius: 8px !important;
    background: var(--accent) !important;

  }

  html body #studio-active-view#studio-active-view
    .studio-header .studio-actions
    #btn-studio-guide#btn-studio-guide > .studio-help-compact-mark,
  html body #studio-active-view#studio-active-view
    .studio-header .studio-actions
    #btn-studio-guide#btn-studio-guide > .studio-help-expanded-label {
    position: absolute;
    inset: 0;

    font-size: 18px !important;

    #btn-studio-guide#btn-studio-guide > .studio-help-expanded-label {
