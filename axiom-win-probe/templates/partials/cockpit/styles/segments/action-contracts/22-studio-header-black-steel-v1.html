<style id="studio-header-black-steel-v1">

    border-top: 1px solid rgba(205, 211, 207, .24) !important;
    border-bottom: 1px solid rgba(205, 211, 207, .32) !important;
    background-color: #121412 !important;
    background-image: url('/static/textures/axiom-brushed-black-steel.png') !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    background-size: cover !important;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .11),
      inset 0 -1px 0 rgba(0, 0, 0, .92),
      inset 0 0 34px rgba(0, 0, 0, .38),
      0 7px 18px rgba(0, 0, 0, .28) !important;

    color: #f5f7f4 !important;
