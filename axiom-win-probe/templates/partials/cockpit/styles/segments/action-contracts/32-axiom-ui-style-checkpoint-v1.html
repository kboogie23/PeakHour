<style id="axiom-ui-style-checkpoint-v1">
  /*
    AXIOM UI STYLE CHECKPOINT v1.
    New controls should use these tokens or the .axiom-ui-btn family.
    Contract:
    - Night primary controls are AXIOM green with dark text.
    - Day primary controls are AXIOM blue with white text.
    - Green/lime surfaces never carry white or pale text.
    - Compact cockpit actions use Bebas Neue at fixed readable sizes.
  */
  :root {
    --axiom-style-button-font: 'Bebas Neue', Impact, sans-serif;
    --axiom-style-body-font: 'Barlow', Inter, system-ui, sans-serif;
    --axiom-style-night-primary-bg: var(--accent, #a3ff00);
    --axiom-style-night-primary-text: #071005;
    --axiom-style-night-secondary-bg: #071005;
    --axiom-style-night-secondary-text: #e8f0e4;
    --axiom-style-night-secondary-border: rgba(163, 255, 0, .50);
    --axiom-style-day-primary-bg: #0047ab;
    --axiom-style-day-primary-text: #ffffff;
    --axiom-style-day-secondary-bg: #ffffff;
    --axiom-style-day-secondary-text: #0047ab;
    --axiom-style-day-secondary-border: rgba(0, 71, 171, .42);
    --axiom-style-green-text: #071005;
    --axiom-style-control-height: 38px;
    --axiom-style-control-radius: 4px;
    --axiom-style-control-font-size: 14px;
    --axiom-style-compact-font-size: 13px;
  }

  html body:not(.light-mode) {
    --axiom-style-primary-bg: var(--axiom-style-night-primary-bg);
    --axiom-style-primary-text: var(--axiom-style-night-primary-text);
    --axiom-style-secondary-bg: var(--axiom-style-night-secondary-bg);
    --axiom-style-secondary-text: var(--axiom-style-night-secondary-text);
    --axiom-style-secondary-border: var(--axiom-style-night-secondary-border);
  }

  html body.light-mode {
    --axiom-style-primary-bg: var(--axiom-style-day-primary-bg);
    --axiom-style-primary-text: var(--axiom-style-day-primary-text);
    --axiom-style-secondary-bg: var(--axiom-style-day-secondary-bg);
    --axiom-style-secondary-text: var(--axiom-style-day-secondary-text);
    --axiom-style-secondary-border: var(--axiom-style-day-secondary-border);
  }

  html body :where(
    .axiom-ui-btn,
    .button--primary,
    .button--secondary,
    .set-brief-action,
    .command-card-cta,
    .connect-source-action,
    .library-empty-primary,
    .library-gap-source-button,
    .library-gap-primary,
    .library-gap-secondary,
    .player-skip-btn,
    .player-add-btn,
    .daw-tool-primary,
    .studio-daw-top-actions button,
    .studio-daw-device-strip button,
    .daw-enhance-compare button,
    .daw-fx-bar-presets button
  ) {
    font-family: var(--axiom-style-button-font) !important;
    font-size: var(--axiom-style-control-font-size) !important;
    font-weight: 400 !important;
    line-height: 1 !important;
    letter-spacing: 0 !important;
    text-transform: uppercase !important;
    border-radius: var(--axiom-style-control-radius) !important;
    box-sizing: border-box !important;
  }

  html body :where(.axiom-ui-btn, .button--primary, .button--secondary) {
    min-height: var(--axiom-style-control-height) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 8px !important;
  }

  html body :where(.axiom-ui-btn--primary, .button--primary) {
    border-color: var(--axiom-style-primary-bg) !important;
    background: var(--axiom-style-primary-bg) !important;
    color: var(--axiom-style-primary-text) !important;
    -webkit-text-fill-color: var(--axiom-style-primary-text) !important;
  }

  html body :where(.axiom-ui-btn--secondary, .button--secondary) {
    border-color: var(--axiom-style-secondary-border) !important;
    background: var(--axiom-style-secondary-bg) !important;
    color: var(--axiom-style-secondary-text) !important;
    -webkit-text-fill-color: var(--axiom-style-secondary-text) !important;
  }

  /* Keep the player CTA opaque even if a WebKit selector or token falls back. */
  html body:not(.light-mode) #audio-player .player-add-btn {
    background: var(--accent, #a3ff00) !important;
    color: #071005 !important;
    -webkit-text-fill-color: #071005 !important;
  }
  html body.light-mode #audio-player .player-add-btn {
    background: #0047ab !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
  }

  html body :where(.axiom-ui-btn--compact, .player-skip-btn, .daw-enhance-compare button, .daw-fx-bar-presets button) {
    min-height: 30px !important;
    font-size: var(--axiom-style-compact-font-size) !important;
    padding-inline: 9px !important;
  }

  html body:not(.light-mode) :where(
    .axiom-ui-btn--primary,
    .button--primary,
    #audio-player .player-add-btn,
    #studio-daw-shell .daw-tool-primary
  ),
  html body:not(.light-mode) :where(
    .library-gap-source-button.is-active,
    .daw-enhance-compare button[aria-pressed="true"],
    .daw-fx-bar-presets button[aria-pressed="true"]
  ) {
    border-color: var(--axiom-style-night-primary-bg) !important;
    background: var(--axiom-style-night-primary-bg) !important;
    color: var(--axiom-style-night-primary-text) !important;
    -webkit-text-fill-color: var(--axiom-style-night-primary-text) !important;
  }

  html body.light-mode :where(
    .axiom-ui-btn--primary,
    .button--primary,
    #audio-player .player-add-btn,
    #studio-daw-shell .daw-tool-primary

  html body.light-mode :where(
    .library-gap-source-button.is-active,
    .daw-enhance-compare button[aria-pressed="true"],
    .daw-fx-bar-presets button[aria-pressed="true"]
  ) {
    border-color: var(--axiom-style-day-primary-bg) !important;
    background: var(--axiom-style-day-primary-bg) !important;
    color: var(--axiom-style-day-primary-text) !important;
    -webkit-text-fill-color: var(--axiom-style-day-primary-text) !important;
  }

  html body:not(.light-mode) :where(
    .axiom-ui-btn--secondary,
    .button--secondary,
    #audio-player .player-skip-btn,
    #studio-daw-shell .studio-daw-top-actions button,
    #studio-daw-shell .studio-daw-device-strip button,
    .library-gap-source-button
  ) {
    border-color: var(--axiom-style-night-secondary-border) !important;
    background: var(--axiom-style-night-secondary-bg) !important;
    color: var(--axiom-style-night-secondary-text) !important;
    -webkit-text-fill-color: var(--axiom-style-night-secondary-text) !important;
  }

  html body.light-mode :where(
    .axiom-ui-btn--secondary,
    .button--secondary,
    #audio-player .player-skip-btn,
    #studio-daw-shell .studio-daw-top-actions button,
    #studio-daw-shell .studio-daw-device-strip button,
    .library-gap-source-button
  ) {
    border-color: var(--axiom-style-day-secondary-border) !important;
    background: var(--axiom-style-day-secondary-bg) !important;
    color: var(--axiom-style-day-secondary-text) !important;
    -webkit-text-fill-color: var(--axiom-style-day-secondary-text) !important;
  }

  html body :where(
    [class*="bg-axiom-accent"],
    .axiom-ui-green-surface
  ),
  html body :where(
    [class*="bg-axiom-accent"],
    .axiom-ui-green-surface

    color: var(--axiom-style-green-text) !important;
    -webkit-text-fill-color: var(--axiom-style-green-text) !important;
    text-shadow: none !important;
  }

  html body.light-mode :where([class*="bg-axiom-accent"], .axiom-ui-btn--primary) {
    background: var(--axiom-style-day-primary-bg) !important;
    border-color: var(--axiom-style-day-primary-bg) !important;
    color: var(--axiom-style-day-primary-text) !important;
    -webkit-text-fill-color: var(--axiom-style-day-primary-text) !important;
  }

  /* Studio mode toggles are large rail instruments, not generic CTA buttons.
     Lock their text fill so Manual Build stays readable when active. */
  html body:not(.light-mode) #studio-active-view #studio-mode-controls .studio-mode-selector #studio-tab-manual.button--primary,
  html body:not(.light-mode) #studio-active-view #studio-mode-controls .studio-mode-selector #studio-tab-manual.button--primary:is(.active, [aria-pressed="true"]) {

  html body:not(.light-mode) #studio-active-view #studio-mode-controls .studio-mode-selector #studio-tab-manual.button--primary :where(span, strong, small, b),
  html body:not(.light-mode) #studio-active-view #studio-mode-controls .studio-mode-selector #studio-tab-manual.button--primary:is(.active, [aria-pressed="true"]) :where(span, strong, small, b) {

  }

  html body:not(.light-mode) #studio-active-view #studio-mode-controls .studio-mode-selector #studio-tab-manual.button--primary.manual-user-activated:is(.active, [aria-pressed="true"]) :where(span, strong, small, b) {

    -webkit-text-fill-color: #071005 !important;
    text-shadow: none !important;
  }

    background: #ffffff !important;
    border-color: rgba(0, 71, 171, .42) !important;

  }

  }

    background: #003f98 !important;
    border-color: #003f98 !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 0 0 1px rgba(0, 71, 171, .35), 0 8px 22px rgba(0, 71, 171, .24) !important;
  }

  html body.light-mode #studio-active-view #studio-mode-controls .studio-mode-selector #studio-tab-manual.button--primary:is(:hover, :focus-visible):not(:disabled) :where(span, strong, small, b) {

  }

  html body.light-mode #studio-active-view #studio-mode-controls .studio-mode-selector #studio-tab-manual.button--primary:is(.active, [aria-pressed="true"]) {
